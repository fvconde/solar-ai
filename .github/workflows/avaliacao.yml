name: Avaliação

# Roda scripts/avaliar.py contra o Gemini e abre um PR com avaliacao/resultado.md
# e o README atualizados. So manual: cada rodada gasta cota do free tier.
on:
  workflow_dispatch:

concurrency:
  group: avaliacao
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  avaliar:
    name: Avaliar extração e busca
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Mesmos modelos fixos do .env.example; uma variable do repo sobrepoe.
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
      GEMINI_EMBEDDING_MODEL: ${{ vars.GEMINI_EMBEDDING_MODEL || 'gemini-embedding-001' }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Conferir o secret
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "Erro: cadastre o secret GEMINI_API_KEY em Settings > Secrets and variables > Actions" >&2
            exit 1
          fi

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Rodar a avaliação
        run: python scripts/avaliar.py

      - name: Publicar o resumo na execução
        if: always()
        run: |
          if [ -f avaliacao/resultado.md ]; then
            cat avaliacao/resultado.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Abrir PR com o resultado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ramo="avaliacao/rodada-${GITHUB_RUN_ID}"
          git switch -c "$ramo"
          git add avaliacao/resultado.md README.md
          if git diff --cached --quiet; then
            echo "Nada mudou desde a ultima rodada publicada."
            exit 0
          fi
          git commit -m "Resultado da avaliacao (rodada ${GITHUB_RUN_ID})"
          git push -u origin "$ramo"
          if ! gh pr create --base "${GITHUB_REF_NAME}" --head "$ramo" \
              --title "Resultado da avaliação (rodada ${GITHUB_RUN_ID})" \
              --body "Gerado pelo workflow Avaliação. Os números estão no resumo desta execução e em avaliacao/resultado.md."; then
            echo "::warning::O ramo $ramo foi enviado, mas o GitHub nao deixou o workflow abrir o PR. Ative Settings > Actions > General > Allow GitHub Actions to create and approve pull requests, ou abra o PR do ramo a mao."
          fi
